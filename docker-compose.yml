# 密钥与差异化配置统一从根目录 .env 注入（参考 .env.example）；
# 关键密钥使用 :?required 语法，缺失时 compose 直接拒绝启动（fail-closed），
# 杜绝使用与 git 内公开示例一致的默认值（曾导致 JWT 密钥可被离线伪造）。
services:
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在根目录 .env 配置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: rbac
      MYSQL_USER: rbac
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在根目录 .env 配置 MYSQL_PASSWORD}
    ports:
      # 仅绑定宿主机回环地址供本地调试；容器之间仍走 3306 服务名互访
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?请在根目录 .env 配置 REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  core:
    build: ./services/core
    environment:
      PORT: 8081
      GIN_MODE: release
      # 与 backend 共用同一 JWT 密钥：网关转发的 accessToken 在 Go 侧同样可验签（纵深防御）
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?请在根目录 .env 配置强随机 JWT_ACCESS_SECRET}
    ports:
      # 仅回环绑定供直连调试；backend 在 compose 网络内走 http://core:8081
      - "127.0.0.1:8081:8081"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?请在根目录 .env 配置强随机 JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?请在根目录 .env 配置强随机 JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: rbac
      DB_PASSWORD: ${MYSQL_PASSWORD:?请在根目录 .env 配置 MYSQL_PASSWORD}
      DB_NAME: rbac
      # 生产建表走 synchronize 仍有风险；保留开关但建议稳定后置 false 并走 migration
      DB_SYNC: ${DB_SYNC:-false}
      # 生产同源经 nginx 反代，无需通配 CORS；此处默认值覆盖本机直连调试场景
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost,http://127.0.0.1}
      RATE_LIMIT_TTL: 60
      RATE_LIMIT_LIMIT: 60
      # 首次启动自动播种管理员；密码从环境注入，避免弱口令 admin/password 暴露公网
      SEED: ${SEED:-true}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在根目录 .env 配置 REDIS_PASSWORD}
      REDIS_DB: 0
      DICT_CACHE_TTL: 21600
      # 日志保留天数（log-center 查询窗口与清理任务共用）
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-7}
      # 微服务网关：/api/svc/core/* 转发到 Go 服务（compose 网络内走服务名）
      PROXY_CORE_TARGET: http://core:8081/api/v1
      AI_ENCRYPTION_KEY: ${AI_ENCRYPTION_KEY:-}
      # 股市圆桌消息面联网检索（可选，不配自动降级）
      BOCHA_API_KEY: ${BOCHA_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      FEISHU_BOT_WEBHOOK: ${FEISHU_BOT_WEBHOOK:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      core:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build: ./frontend
    depends_on:
      - backend
    volumes:
      - frontend_dist:/frontend-dist
    restart: unless-stopped

  mobile-has-doc:
    build:
      context: ./mobile
      args:
        MOBILE_APP: has-doc
    volumes:
      - mobile_dist:/mobile-dist
    restart: unless-stopped

  mobile-has-web:
    build:
      context: ./mobile
      args:
        MOBILE_APP: has-web
    volumes:
      - mobile_dist:/mobile-dist
    restart: unless-stopped

  nginx:
    image: docker.m.daocloud.io/library/nginx:alpine
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
      mobile-has-doc:
        condition: service_started
      mobile-has-web:
        condition: service_started
    ports:
      - "80:80"
    volumes:
      - frontend_dist:/usr/share/nginx/html
      - mobile_dist:/usr/share/nginx/mobile
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  deploy-panel:
    build: ./deploy-panel
    container_name: rbac-deploy-panel
    environment:
      # fail-closed：密钥必须注入，面板不再提供“先到先得”的初始化抢占
      PUBLISH_SECRET: ${PUBLISH_SECRET:?请在根目录 .env 配置强随机 PUBLISH_SECRET}
      PORT: 9090
      PROJECT_PATH: ${HOST_PROJECT_PATH:-/home/sun142725/admin}
      HOST_PROJECT_PATH: ${HOST_PROJECT_PATH:-/home/sun142725/admin}
      COMPOSE_PROJECT_NAME: admin
      COMPOSE_COMPATIBILITY: "1"
    ports:
      # 仅回环绑定：部署面板拥有 docker.sock 与 SSH 私钥，绝不能暴露到外网网卡
      - "127.0.0.1:9090:9090"
    volumes:
      - ./:${HOST_PROJECT_PATH:-/home/sun142725/admin}
      - ./deploy-panel/logs:/app/logs
      - ${HOME}/.ssh:/root/.ssh:ro
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  mysql_data:
  frontend_dist:
  mobile_dist:
