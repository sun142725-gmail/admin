services:
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: rbac
      MYSQL_USER: rbac
      MYSQL_PASSWORD: rbac
    ports:
      # 宿主机用 3307，避免与其它项目（如 nest-first 的 mysql_db）占用 3306 冲突；
      # 容器之间仍走 3306（DB_HOST=mysql 时不受影响）。
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    ports:
      - "6379:6379"

  core:
    build: ./services/core
    environment:
      PORT: 8081
      GIN_MODE: release
      # 与 backend 共用同一 JWT 密钥：网关转发的 accessToken 在 Go 侧同样可验签（纵深防御）
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-rbac_access_secret}
    ports:
      # 暴露给宿主机便于直连调试；生产不需要时可去掉
      - "8081:8081"
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_ACCESS_SECRET: rbac_access_secret
      JWT_REFRESH_SECRET: rbac_refresh_secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: rbac
      DB_PASSWORD: rbac
      DB_NAME: rbac
      DB_SYNC: "true"
      CORS_ORIGIN: "*"
      RATE_LIMIT_TTL: 60
      RATE_LIMIT_LIMIT: 60
      SEED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      DICT_CACHE_TTL: 21600
      # 微服务网关：/api/svc/core/* 转发到 Go 服务（compose 网络内走服务名）
      PROXY_CORE_TARGET: http://core:8081/api/v1
      AI_ENCRYPTION_KEY: ${AI_ENCRYPTION_KEY:-}
      # 股市圆桌消息面联网检索（可选，不配自动降级）
      BOCHA_API_KEY: ${BOCHA_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      FEISHU_BOT_WEBHOOK: ${FEISHU_BOT_WEBHOOK:-}
    depends_on:
      - mysql
      - redis
      - core
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/app/uploads

  frontend:
    build: ./frontend
    depends_on:
      - backend
    volumes:
      - frontend_dist:/frontend-dist

  mobile-has-doc:
    build:
      context: ./mobile
      args:
        MOBILE_APP: has-doc
    volumes:
      - mobile_dist:/mobile-dist

  mobile-has-web:
    build:
      context: ./mobile
      args:
        MOBILE_APP: has-web
    volumes:
      - mobile_dist:/mobile-dist

  nginx:
    image: docker.m.daocloud.io/library/nginx:alpine
    depends_on:
      - backend
      - frontend
      - mobile-has-doc
      - mobile-has-web
    ports:
      - "80:80"
    volumes:
      - frontend_dist:/usr/share/nginx/html
      - mobile_dist:/usr/share/nginx/mobile
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  deploy-panel:
    build: ./deploy-panel
    container_name: rbac-deploy-panel
    environment:
      PUBLISH_SECRET: ${PUBLISH_SECRET:-}
      PORT: 9090
      PROJECT_PATH: ${HOST_PROJECT_PATH:-/home/sun142725/admin}
      HOST_PROJECT_PATH: ${HOST_PROJECT_PATH:-/home/sun142725/admin}
      COMPOSE_PROJECT_NAME: admin
      COMPOSE_COMPATIBILITY: "1"
    ports:
      - "9090:9090"
    volumes:
      - ./:${HOST_PROJECT_PATH:-/home/sun142725/admin}
      - ./deploy-panel/logs:/app/logs
      - ${HOME}/.ssh:/root/.ssh:ro
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  mysql_data:
  frontend_dist:
  mobile_dist:
