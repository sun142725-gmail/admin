server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 与后端 2MB 上传限制对齐并留余量（默认 1MB 会让经域名上传的文件 413）
  client_max_body_size 4m;

  # 基础安全响应头（此前完全缺失）
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # 文本类资源 gzip（JS/CSS 主包 gzip 后约 1/3）
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  location / {
    try_files $uri /index.html;
  }

  # 带 hash 的静态资源长缓存（Vite 产物文件名含内容摘要，变更即换名）
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri /index.html;
  }

  location = /has-doc {
    return 301 /has-doc/;
  }

  location /has-doc/ {
    alias /usr/share/nginx/mobile/has-doc/;
    try_files $uri $uri/ /has-doc/index.html;
  }

  location = /has-web {
    return 301 /has-web/;
  }

  location /has-web/ {
    alias /usr/share/nginx/mobile/has-web/;
    try_files $uri $uri/ /has-web/index.html;
  }

  location /api/ {
    proxy_pass http://backend:3000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # SSE / 长耗时 AI 流式接口：默认 60s 读超时会切断连接
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # SSE 路由由后端响应头 X-Accel-Buffering: no 按需关闭缓冲，普通接口保持缓冲加速
  }
}
