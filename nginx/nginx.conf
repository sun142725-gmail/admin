server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri /index.html;
  }

  location = /has-doc {
    return 301 /has-doc/;
  }

  location /has-doc/ {
    alias /usr/share/nginx/mobile/has-doc/;
    try_files $uri $uri/ /has-doc/index.html;
  }

  location = /has-web {
    return 301 /has-web/;
  }

  location /has-web/ {
    alias /usr/share/nginx/mobile/has-web/;
    try_files $uri $uri/ /has-web/index.html;
  }

  location /api/ {
    proxy_pass http://backend:3000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
